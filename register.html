<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أنشئ متجرك — متجري</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold">م</div>
        <span class="text-xl font-bold text-gray-900">متجري</span>
      </div>
      <div class="text-sm text-gray-600">
        لديك حساب؟ <a href="01-login.html" class="text-indigo-600 font-medium">دخول</a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">

    <!-- Progress -->
    <div class="mb-10">
      <div class="flex items-center justify-between mb-3">
        <div class="flex flex-col items-center flex-1">
          <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">1</div>
          <span class="text-xs mt-2 font-medium text-indigo-600">الحساب</span>
        </div>
        <div class="flex-1 h-0.5 bg-indigo-600 -mt-6"></div>
        <div class="flex flex-col items-center flex-1">
          <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">2</div>
          <span class="text-xs mt-2 font-medium text-indigo-600">المتجر</span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200 -mt-6"></div>
        <div class="flex flex-col items-center flex-1">
          <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold">3</div>
          <span class="text-xs mt-2 text-gray-500">الباقة</span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200 -mt-6"></div>
        <div class="flex flex-col items-center flex-1">
          <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold">4</div>
          <span class="text-xs mt-2 text-gray-500">الدفع</span>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">اختر الباقة المناسبة</h1>
      <p class="text-gray-500 mb-8">يمكنك الترقية أو الإلغاء في أي وقت</p>

      <!-- Plans -->
      <div class="grid md:grid-cols-3 gap-4 mb-8">
        <!-- Starter -->
        <label class="border-2 border-gray-200 rounded-xl p-5 cursor-pointer hover:border-indigo-300 transition">
          <input type="radio" name="plan" value="starter" class="sr-only">
          <div class="font-bold text-gray-900 mb-1">الأساسية</div>
          <div class="mb-3">
            <span class="text-2xl font-bold text-gray-900">99</span>
            <span class="text-sm text-gray-500">ر.س/شهر</span>
          </div>
          <ul class="text-sm text-gray-600 space-y-1.5">
            <li>✓ 50 منتج</li>
            <li>✓ موظف واحد</li>
            <li>✓ 500MB تخزين</li>
          </ul>
        </label>

        <!-- Pro (selected) -->
        <label class="border-2 border-indigo-600 rounded-xl p-5 cursor-pointer relative bg-indigo-50/30">
          <input type="radio" name="plan" value="pro" checked class="sr-only">
          <span class="absolute -top-2 right-4 bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full">الأكثر شيوعاً</span>
          <div class="font-bold text-gray-900 mb-1">الاحترافية</div>
          <div class="mb-3">
            <span class="text-2xl font-bold text-gray-900">249</span>
            <span class="text-sm text-gray-500">ر.س/شهر</span>
          </div>
          <ul class="text-sm text-gray-600 space-y-1.5">
            <li>✓ 500 منتج</li>
            <li>✓ 5 موظفين</li>
            <li>✓ 5GB تخزين</li>
            <li>✓ تقارير متقدمة</li>
          </ul>
        </label>

        <!-- Business -->
        <label class="border-2 border-gray-200 rounded-xl p-5 cursor-pointer hover:border-indigo-300 transition">
          <input type="radio" name="plan" value="business" class="sr-only">
          <div class="font-bold text-gray-900 mb-1">الأعمال</div>
          <div class="mb-3">
            <span class="text-2xl font-bold text-gray-900">599</span>
            <span class="text-sm text-gray-500">ر.س/شهر</span>
          </div>
          <ul class="text-sm text-gray-600 space-y-1.5">
            <li>✓ منتجات غير محدودة</li>
            <li>✓ 20 موظف</li>
            <li>✓ 50GB تخزين</li>
            <li>✓ API + Webhooks</li>
          </ul>
        </label>
      </div>

      <!-- Cycle Toggle -->
      <div class="flex items-center justify-center gap-3 mb-8 p-3 bg-gray-50 rounded-xl">
        <span class="text-sm text-gray-600">دورة الفوترة:</span>
        <div class="flex bg-white rounded-lg p-1 border">
          <button class="px-4 py-1.5 text-sm rounded-md bg-indigo-600 text-white font-medium">شهري</button>
          <button class="px-4 py-1.5 text-sm rounded-md text-gray-600 hover:bg-gray-50">سنوي <span class="text-green-600 text-xs">(خصم 20%)</span></button>
        </div>
      </div>

      <!-- Summary -->
      <div class="bg-gray-50 rounded-xl p-4 mb-6 text-sm">
        <div class="flex justify-between mb-1"><span class="text-gray-600">الباقة الاحترافية (شهري)</span><span class="font-medium">249.00 ر.س</span></div>
        <div class="flex justify-between mb-1"><span class="text-gray-600">ضريبة القيمة المضافة (15%)</span><span class="font-medium">37.35 ر.س</span></div>
        <div class="flex justify-between pt-2 border-t border-gray-200 mt-2 font-bold text-gray-900"><span>الإجمالي</span><span>286.35 ر.س</span></div>
      </div>

      <label class="flex items-start gap-2 mb-6 text-sm">
        <input type="checkbox" class="mt-0.5 rounded" checked>
        <span class="text-gray-600">أوافق على <a href="#" class="text-indigo-600">شروط الخدمة</a> و <a href="#" class="text-indigo-600">سياسة الخصوصية</a></span>
      </label>

      <div class="flex gap-3">
        <button class="px-6 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50">السابق</button>
        <a href="08-pending-approval.html" class="flex-1 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 text-center">متابعة للدفع</a>
      </div>
    </div>

  </main>

</body>
</html>
